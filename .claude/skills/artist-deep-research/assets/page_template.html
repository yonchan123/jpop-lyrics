<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Hero motif (canvas) is per-artist: replace drawMotif() with something from the artist's own world.
   Layout: dark hero band over a reading column; sticky constellation TOC on wide screens */
:root{
  --bg:#f3f4f8; --surface:#ffffff; --fg:#1b1f33; --muted:#5d6380;
  --line:#d9dcea; --accent:__ACCENT__; --star:#c8901a;
  --t-fact:#2f7a5b; --t-self:#3a4fb8; --t-crit:#9a5a12; --t-int:#8a3d7a;
  --dome-a:#1a2050; --dome-b:#0d1030; --dome-fg:#eef0ff;
  --font-display:"Nanum Myeongjo","Noto Serif KR",serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0f22; --surface:#141836; --fg:#e4e7fa; --muted:#9aa0c4;
  --line:#272c55; --accent:__ACCENT_DARK__; --star:#f2c45a;
  --t-fact:#7fd3ad; --t-self:#a9b7ff; --t-crit:#f0b46a; --t-int:#e49ad3;
  --dome-a:#141a48; --dome-b:#05071a; --dome-fg:#eef0ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0f22; --surface:#141836; --fg:#e4e7fa; --muted:#9aa0c4;
  --line:#272c55; --accent:__ACCENT_DARK__; --star:#f2c45a;
  --t-fact:#7fd3ad; --t-self:#a9b7ff; --t-crit:#f0b46a; --t-int:#e49ad3;
  --dome-a:#141a48; --dome-b:#05071a; --dome-fg:#eef0ff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.8;margin:0}
.dome{position:relative;overflow:hidden;background:radial-gradient(120% 140% at 50% 0%,var(--dome-a),var(--dome-b));color:var(--dome-fg);
  padding-block:56px 44px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dome canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.dome-inner{position:relative;max-width:1100px;margin:0 auto}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.dome h1{font-family:var(--font-display);font-weight:800;font-size:clamp(28px,5vw,46px);line-height:1.3;margin:10px 0 14px;text-wrap:balance;max-width:22ch}
.dome p.sub{max-width:62ch;opacity:.85;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:48px;
  padding-block:40px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 24px);align-self:start;max-height:calc(100vh - 48px);overflow:auto;font-size:13.5px}
nav.toc .label{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
nav.toc ol{list-style:none;margin:0;padding:0;border-left:1px solid var(--line)}
nav.toc a{display:block;padding:6px 0 6px 14px;margin-left:-1px;border-left:2px solid transparent;color:var(--muted);text-decoration:none;line-height:1.45}
nav.toc a:hover,nav.toc a:focus-visible{color:var(--fg)}
nav.toc a.on{color:var(--fg);border-left-color:var(--star)}
article{min-width:0}
article>*{max-width:68ch}
article h1{display:none}
article h2{font-family:var(--font-display);font-weight:800;font-size:clamp(22px,3vw,28px);line-height:1.4;margin:64px 0 16px;text-wrap:balance;scroll-margin-top:24px}
article h2::before{content:"✦";color:var(--star);font-size:.6em;vertical-align:.35em;margin-right:10px}
article h3{font-size:18px;font-weight:600;margin:36px 0 10px;scroll-margin-top:24px}
article p{margin:0 0 18px}
article a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px;overflow-wrap:anywhere}
article hr{border:0;border-top:1px solid var(--line);margin:48px 0;max-width:none}
article blockquote{margin:0 0 24px;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:15px}
article blockquote p{margin:0}
.tbl{max-width:none;overflow-x:auto;margin:8px 0 24px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.55;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-weight:600;color:var(--muted);font-size:12.5px;white-space:nowrap;background:color-mix(in srgb,var(--surface) 85%,var(--accent) 15%)}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{white-space:nowrap}
.tag{display:inline-block;font-family:var(--font-mono);font-size:11.5px;font-weight:500;letter-spacing:.04em;padding:1px 7px;border-radius:4px;border:1px solid currentColor;margin-right:4px;vertical-align:1px;line-height:1.5}
.tag.fact{color:var(--t-fact)} .tag.self{color:var(--t-self)} .tag.crit{color:var(--t-crit)} .tag.int{color:var(--t-int)}
.dome .tag{background:rgba(255,255,255,.06)}
.dome .tag.fact{color:#7fd3ad}.dome .tag.self{color:#a9b7ff}.dome .tag.crit{color:#f0b46a}.dome .tag.int{color:#e49ad3}
footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:20px;margin-top:56px}
#loading{color:var(--muted)}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr);gap:24px}
  nav.toc{position:static;max-height:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="dome">
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="dome-inner">
    <div class="eyebrow">__EYEBROW__</div>
    <h1>__H1__</h1>
    <p class="sub">__SUBTITLE__</p>
    <div class="legend" aria-label="표기 범례">
      <span class="tag fact">확인</span><span class="tag self">본인</span><span class="tag crit">평론</span><span class="tag int">해석</span>
    </div>
  </div>
</header>

<div class="wrap">
  <nav class="toc" aria-label="목차"><div class="label">Contents</div><ol id="toc"></ol></nav>
  <article id="doc"><p id="loading">본문을 불러오는 중…</p></article>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const MD = __MD_JSON__;
(function(){
  const doc = document.getElementById('doc');
  let html;
  try { html = marked.parse(MD.replace(/~/g,'\\~'), {gfm:true}); }
  catch(e){ html = '<pre style="white-space:pre-wrap">'+MD.replace(/[&<]/g,c=>c==='&'?'&amp;':'&lt;')+'</pre>'; }
  const map = {'확인':'fact','본인':'self','본인·일기':'self','평론':'crit','보도':'crit','해석':'int'};
  html = html.replace(/<strong>\[(확인|본인·일기|본인|평론|보도|해석)\]<\/strong>/g,(m,k)=>'<span class="tag '+map[k]+'">'+k+'</span>');
  doc.innerHTML = html + '<footer>출처 링크는 각 문단과 표에 붙어 있습니다. 가사는 인용하지 않고 내용을 풀어 썼습니다. 인터뷰 인용은 30자 이내입니다.</footer>';
  doc.querySelectorAll('table').forEach(t=>{const w=document.createElement('div');w.className='tbl';t.parentNode.insertBefore(w,t);w.appendChild(t);});
  doc.querySelectorAll('a[href^="http"]').forEach(a=>{a.target='_blank';a.rel='noopener'});
  const toc = document.getElementById('toc'); const heads=[...doc.querySelectorAll('h2')];
  heads.forEach((h,i)=>{h.id='s'+(i+1);const li=document.createElement('li');const a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent;li.appendChild(a);toc.appendChild(li);});
  if (location.hash){const t=document.getElementById(location.hash.slice(1)); if(t) t.scrollIntoView();}
  const links=[...toc.querySelectorAll('a')];
  if ('IntersectionObserver' in window){
    const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle('on',l.getAttribute('href')==='#'+e.target.id));}})},{rootMargin:'0px 0px -70% 0px'});
    heads.forEach(h=>io.observe(h));
  }
})();
(function(){
  const c=document.getElementById('sky'); const x=c.getContext('2d'); let seed=7;
  const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  function draw(){
    const r=window.devicePixelRatio||1, w=c.clientWidth, h=c.clientHeight; c.width=w*r; c.height=h*r; x.setTransform(r,0,0,r,0,0); seed=7;
    const n=Math.round(w*h/2600);
    for(let i=0;i<n;i++){const px=rnd()*w,py=rnd()*h,s=rnd()*1.3+.2;x.globalAlpha=.25+rnd()*.6;x.fillStyle='#ffffff';x.beginPath();x.arc(px,py,s,0,6.283);x.fill();}
    // drawMotif(x,w,h): add one artist-specific mark here (constellation, waveform, city lights...)
    x.globalAlpha=1;
  }
  draw(); let t; addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(draw,150)});
})();
</script>
